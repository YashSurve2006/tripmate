<svg xmlns="http://www.w3.org/2000/svg" width="760" height="700" viewBox="0 0 760 700" role="img" aria-labelledby="title desc">
<title id="title">TripMate system architecture</title><desc id="desc">Mobile UI connects to the theme engine, Excel generator, local SQLite, and shared finance core. The shared core contains paise math and debt simplification. An optional backend API uses Prisma and PostgreSQL.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#160B37"/><stop offset="1" stop-color="#24104D"/></linearGradient><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#A78BFA"/></marker></defs>
<rect width="760" height="700" rx="24" fill="#111019"/><text x="380" y="43" text-anchor="middle" fill="#F8FAFC" font-family="Arial,sans-serif" font-size="25" font-weight="700">TripMate System Architecture</text>
<g font-family="Arial,sans-serif"><rect x="35" y="65" width="690" height="295" rx="18" fill="#19142A" stroke="#8B5CF6" stroke-width="1.5"/><text x="60" y="94" fill="#C4B5FD" font-size="16" font-weight="700">MOBILE APP • EXPO / REACT NATIVE</text>
<rect x="70" y="116" width="620" height="58" rx="12" fill="#6D28D9"/><text x="380" y="151" text-anchor="middle" fill="#FFFFFF" font-size="19" font-weight="700">UI Screens &amp; Components</text>
<g stroke="#A78BFA" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M380 174 V196 H180 V215"/><path d="M380 196 H580 V215"/><path d="M380 196 V286"/></g>
<rect x="60" y="215" width="240" height="57" rx="11" fill="url(#bg)" stroke="#A78BFA"/><text x="180" y="238" text-anchor="middle" fill="#EDE9FE" font-size="14" font-weight="600">Theme Engine</text><text x="180" y="257" text-anchor="middle" fill="#C4B5FD" font-size="12">Light / Dark / OLED</text>
<rect x="460" y="215" width="240" height="57" rx="11" fill="url(#bg)" stroke="#A78BFA"/><text x="580" y="238" text-anchor="middle" fill="#EDE9FE" font-size="14" font-weight="600">Excel Export</text><text x="580" y="257" text-anchor="middle" fill="#C4B5FD" font-size="12">10-sheet workbook</text>
<rect x="160" y="286" width="440" height="52" rx="11" fill="#21133E" stroke="#A78BFA"/><text x="380" y="308" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="600">Local SQLite</text><text x="380" y="326" text-anchor="middle" fill="#C4B5FD" font-size="12">Database &amp; migrations</text>
<rect x="35" y="390" width="690" height="142" rx="18" fill="#19142A" stroke="#34D399" stroke-width="1.5"/><text x="60" y="419" fill="#A7F3D0" font-size="16" font-weight="700">SHARED FINANCE CORE • TYPESCRIPT</text>
<rect x="60" y="438" width="300" height="70" rx="12" fill="#064E3B" stroke="#34D399"/><text x="210" y="466" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="600">Paise Math</text><text x="210" y="488" text-anchor="middle" fill="#A7F3D0" font-size="12">Exact minor-unit arithmetic</text>
<rect x="400" y="438" width="300" height="70" rx="12" fill="#064E3B" stroke="#34D399"/><text x="550" y="466" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="600">Debt Simplifier</text><text x="550" y="488" text-anchor="middle" fill="#A7F3D0" font-size="12">Zero-sum settlement logic</text>
<path d="M380 360 V390" stroke="#A78BFA" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arrow)" fill="none"/>
<rect x="35" y="560" width="690" height="105" rx="18" fill="#19142A" stroke="#64748B" stroke-width="1.5"/><text x="60" y="589" fill="#CBD5E1" font-size="16" font-weight="700">OPTIONAL BACKEND</text><rect x="60" y="604" width="640" height="43" rx="10" fill="#272536" stroke="#64748B"/><text x="380" y="631" text-anchor="middle" fill="#F8FAFC" font-size="16">API → Prisma ORM → PostgreSQL</text>
</g></svg>