<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" viewBox="0 0 760 500" role="img" aria-labelledby="title desc">
<title id="title">Exact paise split flow</title><desc id="desc">A ₹100 expense becomes 10,000 paise, is split across three members into 3,334, 3,333, and 3,333 paise, and sums exactly to 10,000 paise.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#160B37"/><stop offset="1" stop-color="#24104D"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#A78BFA"/></marker></defs>
<rect width="760" height="500" rx="24" fill="#111019"/><text x="380" y="44" text-anchor="middle" fill="#F8FAFC" font-family="Arial,sans-serif" font-size="25" font-weight="700">Exact Paise Split</text><text x="380" y="69" text-anchor="middle" fill="#C4B5FD" font-family="Arial,sans-serif" font-size="14">Integer arithmetic prevents rounding drift</text>
<g stroke="#A78BFA" stroke-width="2.5" fill="none" marker-end="url(#arrow)"><path d="M380 132 V153"/><path d="M380 213 V237 H135 V263"/><path d="M380 237 V263"/><path d="M380 237 H625 V263"/><path d="M135 323 V350 H380 V371"/><path d="M380 323 V371"/><path d="M625 323 V350 H380"/></g>
<g font-family="Arial,sans-serif" text-anchor="middle"><rect x="180" y="87" width="400" height="45" rx="12" fill="url(#bg)" stroke="#8B5CF6"/><text x="380" y="115" fill="#FFFFFF" font-size="18" font-weight="600">Expense: ₹100.00</text>
<rect x="180" y="153" width="400" height="60" rx="12" fill="#6D28D9"/><text x="380" y="177" fill="#EDE9FE" font-size="12" font-weight="700">CONVERT TO INTEGER MINOR UNITS</text><text x="380" y="198" fill="#FFFFFF" font-size="18" font-weight="600">10,000 Paise</text>
<rect x="35" y="263" width="200" height="60" rx="12" fill="#21133E" stroke="#A78BFA"/><text x="135" y="287" fill="#C4B5FD" font-size="13">Member 1</text><text x="135" y="309" fill="#FFFFFF" font-size="18" font-weight="700">3,334 paise</text>
<rect x="280" y="263" width="200" height="60" rx="12" fill="#21133E" stroke="#A78BFA"/><text x="380" y="287" fill="#C4B5FD" font-size="13">Member 2</text><text x="380" y="309" fill="#FFFFFF" font-size="18" font-weight="700">3,333 paise</text>
<rect x="525" y="263" width="200" height="60" rx="12" fill="#21133E" stroke="#A78BFA"/><text x="625" y="287" fill="#C4B5FD" font-size="13">Member 3</text><text x="625" y="309" fill="#FFFFFF" font-size="18" font-weight="700">3,333 paise</text>
<rect x="125" y="371" width="510" height="74" rx="14" fill="#064E3B" stroke="#34D399" stroke-width="1.5"/><text x="380" y="399" fill="#A7F3D0" font-size="13" font-weight="700">EXACT TOTAL • ZERO ROUNDING DRIFT</text><text x="380" y="425" fill="#FFFFFF" font-size="21" font-weight="700">3,334 + 3,333 + 3,333 = 10,000</text></g></svg>